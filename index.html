<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Inu Rescue</title><link rel="stylesheet" href="style.css"></head><body>
<main><canvas id="screen" width="256" height="240" aria-label="Inu Rescue game"></canvas>
<div id="pad">
  <div class="dpad"><button data-k="up">▲</button><div><button data-k="left">◀</button><button data-k="right">▶</button></div><button data-k="down">▼</button></div>
  <div class="mid"><button data-k="start" class="sm">START</button><button data-k="pause" class="sm">PAUSE</button></div>
  <div class="act"><button data-k="jump" class="big">JUMP</button></div>
</div></main>
<script type="module" src="src/main.js"></script></body></html>
